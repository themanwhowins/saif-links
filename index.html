

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#090b10">

  <meta name="description" content="All my links in one place.">

  <title>SAIF | Official Links</title>

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    body {

      min-height: 100vh;

      background:

        radial-gradient(ellipse at top, #172033 0%, #090b10 65%);

      color: #f4f6fb;

      font-family: Arial, Helvetica, sans-serif;

      display: flex;

      justify-content: center;

      padding: 35px 20px;

    }

    main {

      width: 100%;

      max-width: 520px;

    }

    header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      color: #a0a8b8;

      font-size: 11px;

      letter-spacing: 2px;

    }

    .logo {

      color: #ffffff;

      font-size: 19px;

      font-weight: 800;

      letter-spacing: 4px;

    }

    .hero {

      text-align: center;

      padding: 75px 0 40px;

    }

    h1 {

      font-size: 52px;

      letter-spacing: 8px;

      margin-bottom: 14px;

    }

    .subtitle {

      color: #a0a8b8;

      font-size: 14px;

      letter-spacing: 0.5px;

    }

    .links {

      display: grid;

      gap: 13px;

    }

    .link {

      display: flex;

      align-items: center;

      gap: 15px;

      padding: 18px;

      background: rgba(17, 21, 29, 0.9);

      border: 1px solid #252c38;

      border-radius: 16px;

      color: #f4f6fb;

      text-decoration: none;

      transition: 0.2s ease;

    }

    .link:hover {

      transform: translateY(-3px);

      border-color: #758bb7;

      background: #171e2a;

    }

    .icon {

      width: 45px;

      height: 45px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 13px;

      background: #202938;

      color: #a8bfff;

      font-size: 16px;

      font-weight: bold;

    }

    .details {

      flex: 1;

    }

    .details strong {

      display: block;

      font-size: 15px;

      margin-bottom: 5px;

    }

    .details small {

      color: #a0a8b8;

      font-size: 12px;

    }

    .arrow {

      color: #8794aa;

      font-size: 21px;

    }

    footer {

      text-align: center;

      color: #707b8e;

      font-size: 11px;

      margin-top: 35px;

      letter-spacing: 0.5px;

    }

    @media (max-width: 400px) {

      .hero {

        padding-top: 60px;

      }

      h1 {

        font-size: 43px;

      }

      .link {

        padding: 15px;

      }

    }

  </style>

</head>

<body>

  <main>

    <header>

      <span class="logo">SAIF.</span>

      <span>OFFICIAL LINKS</span>

    </header>

    <section class="hero">

      <h1>SAIF</h1>

      <p class="subtitle">All my links, in one place.</p>

    </section>

    <nav class="links" aria-label="Social links">

      <a class="link"

         href="https://www.instagram.com/ssaifalghamdi?vrfl=aW1jZHF6cTNhdnk0&utm_source=qr/"

         target="_blank"

         rel="noopener noreferrer">

        <span class="icon">IG</span>

        <span class="details">

          <strong>Instagram</strong>

          <small>Follow me on Instagram</small>

        </span>

        <span class="arrow">↗</span>

      </a>

      <a class="link"

         href="https://discord.com/"

         target="_blank"

         rel="noopener noreferrer">

        <span class="icon">DS</span>

        <span class="details">

          <strong>Discord</strong>

          <small>Connect with me on Discord</small>

        </span>

        <span class="arrow">↗</span>

      </a>

      <a class="link"

         href="https://x.com/2_t0o?s=11"

         target="_blank"

         rel="noopener noreferrer">

        <span class="icon">𝕏</span>

        <span class="details">

          <strong>X (Twitter)</strong>

          <small>Follow my updates</small>

        </span>

        <span class="arrow">↗</span>

      </a>

      <a class="link" href="for.contact.saif@gmail.com">

        <span class="icon">@</span>

        <span class="details">

          <strong>Email Me</strong>

          <small>Get in touch by email 
            "for.contact.saif@gmail</small>

        </span>

        <span class="arrow">↗</span>

      </a>

    </nav>

    <footer>

      © 2026 SAIF · ALL RIGHTS RESERVED

    </footer>

  </main>

</body>

</html>
